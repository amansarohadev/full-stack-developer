<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Generate a <span id="green-txt"><br>random password</span></h1>
    <h2>Never use an insecure password again.</h2>
    <label>Length</label>
    <input type="number" id="passwordLength" value="15" min="1">
    <label>Numbers</label>
    <input type="checkbox" id="includeNumbers" checked>
    <label>Symbols</label>
    <input type="checkbox" id="includeSymbols" checked>
    <br>
    <button id="btn" onclick="passwordGenerate()">Generate passwords</button>
    <div id="break"></div>
    <div id="password-boxes">
        <div class="passwords" onclick="copy(this)" id="firstPassword"></div>
        <div class="passwords" onclick="copy(this)" id="secondPassword"></div>
    </div>
    <script src="index.js"></script>
</body>

</html>
